br:
  com:
    tasknote:
      server:
        jwt-secret: ${SECURITY_KEY}
        target-env: ${TARGET_ENV:development}
        home-window-minutes: ${HOME_WINDOW_MINUTES:1440}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://flattop-depth-dropper.ngrok-free.dev}
logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    br.com.tasknoteapp: INFO

mailgun:
  api-key: ${MAILGUN_APIKEY:abc123456}
  domain: tasknote.cc
  sender-email: no-reply@tasknote.cc

server:
  port: 8585
  error:
    include-message: never
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}
spring:
  application:
    name: tasknote-api
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:tasknote}
    username: ${POSTGRES_USER:tasknoteuser}
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
