name: Build Server Candidate

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: "ghcr.io/thermcampos/tasknote/server"

jobs:
  build-and-push-server:
    name: Build & Push Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'server/pom.xml'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ./server
        run: |
          ./mvnw -Pnative -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName=${{ env.DOCKER_IMAGE }}:latest \
            -Dspring-boot.build-image.builder=paketobuildpacks/builder-jammy-tiny:0.0.505

      - name: Push imagese
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Log pushed images
        run: |
          echo "Pushed images:"
          echo "  rmcampos/tasknote-api:latest"
