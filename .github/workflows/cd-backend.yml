name: Backend CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/cd-backend.yml'

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: "ghcr.io/thermcampos/tasknote/server"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'server/pom.xml'

      - name: Generate version tag
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          TAG="api-v${DATE}.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

      - name: Build Docker image with Spring Boot
        working-directory: ./server
        run: |
          ./mvnw -Pnative -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName=${{ env.DOCKER_IMAGE }}:latest \
            -Dspring-boot.build-image.builder=paketobuildpacks/builder-jammy-tiny:0.0.505

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Tag and push Docker image
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.tag }}
          docker push ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Output Docker image URLs
        run: |
          echo ""
          echo "=========================================="
          echo "🚀 Docker Images Published Successfully!"
          echo "=========================================="
          echo ""
          echo "API Image:"
          echo "  ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.tag }}"
          echo "  ${{ env.DOCKER_IMAGE }}:latest"
          echo ""
          echo "=========================================="
