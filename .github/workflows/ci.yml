name: CI

on:
  pull_request:
    branches: ['**/*']

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Runs the full backend gate (checkstyle, compile, unit + Testcontainers
      # integration tests) inside the dev container defined in .devcontainer/.
      # Docker-in-Docker gives Testcontainers its own daemon inside the container.
      - name: Run backend quality gate in dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/thermcampos/tasknote/devcontainer
          push: never
          runCmd: bash tools/check-backend.sh

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Cache npm dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Cypress binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/client/package-lock.json') }}

      - name: Install dependencies
        run: npm install
        working-directory: ./client

      - name: Run lint
        run: npm run lint
        working-directory: ./client

      - name: Run build
        run: npm run build
        working-directory: ./client

      - name: Run tests
        run: npm run test:no-watch
        working-directory: ./client

      - name: Run Cypress E2E tests (headless)
        run: bash tools/check-frontend-e2e.sh

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots
          if-no-files-found: ignore
