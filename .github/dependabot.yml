version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule: { interval: "weekly", day: "monday" }
    cooldown: { default-days: 7, semver-major-days: 14 }
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/server"
    schedule: { interval: "weekly", day: "monday" }
    cooldown: { default-days: 7, semver-major-days: 14 }
    groups:
      java-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
